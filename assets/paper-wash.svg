<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" width="1600" height="1000">
  <!-- Soft blue watercolor blooms on paper (static). -->
  <defs>
    <filter id="w" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="4" seed="5" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="120" xChannelSelector="R" yChannelSelector="G"/><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="p" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="2"/><feColorMatrix values="0 0 0 0 .32  0 0 0 0 .36  0 0 0 0 .42  0 0 0 .09 0"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="#f4f6f5"/>
  <g filter="url(#w)" opacity=".45">
    <ellipse cx="180" cy="70" rx="540" ry="250" fill="#5fa0d8"/>
    <ellipse cx="1460" cy="150" rx="470" ry="230" fill="#78b4e3"/>
    <ellipse cx="860" cy="990" rx="720" ry="210" fill="#8cbfdd"/>
    <ellipse cx="1260" cy="640" rx="260" ry="150" fill="#a8cfea"/>
    <ellipse cx="110" cy="760" rx="250" ry="170" fill="#9ac6e6"/>
  </g>
  <rect width="1600" height="1000" filter="url(#p)"/>
</svg>
